[package]
name = "zlib-rs-verification"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]

[lib]
path = "lib.rs"

[dependencies]
vstd = { git = "https://github.com/verus-lang/verus", rev = "8bf68ee741df833ea5d0fe6a2255126fdea87e47" }

[package.metadata.verus]
verify = true
fmt-as-rust = true

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(verus_keep_ghost)'] }
